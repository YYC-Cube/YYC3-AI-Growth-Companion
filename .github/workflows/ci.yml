name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 质量门禁
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装依赖
        run: bun install --frozen-lockfile

      # ===== 阻塞门禁 =====

      - name: 单元测试（阻塞）
        run: bun test

      - name: 依赖安全审计（阻塞，high 及以上）
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit --package-lock-only --audit-level=high

      - name: 生产构建（阻塞）
        run: bun run build
        env:
          # 构建无需真实密钥：AI 路由运行时才读取，未配置时自动降级
          BIGMODEL_API_KEY: ''

      # ===== 报告项（存量债，暂不阻塞）=====

      - name: 类型检查（报告，基线 778）
        run: bunx tsc --noEmit 2>&1 | tail -20
        continue-on-error: true

      - name: Lint（报告，存量 6711）
        run: bunx eslint . 2>&1 | tail -20
        continue-on-error: true

  smoke:
    name: 生产冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 构建
        run: bun run build

      - name: 启动并冒烟测试
        run: |
          bun run start &
          SERVER_PID=$!
          # 等待就绪
          for i in $(seq 1 30); do
            curl -sf http://localhost:3201/ > /dev/null && break
            sleep 2
          done
          set -e
          echo "── 首页"
          curl -sf -o /dev/null -w "%{http_code}\n" http://localhost:3201/
          echo "── SQLite API（自动建表+种子）"
          curl -sf http://localhost:3201/api/children | grep -q '"success":true'
          echo "── 徽章 API"
          curl -sf "http://localhost:3201/api/badges?action=stats" | grep -q '"success":true'
          echo "── 监控指标"
          curl -sf http://localhost:3201/api/metrics | grep -q '^yyc3_'
          echo "── AI 聊天（无密钥降级路径）"
          curl -sf -X POST http://localhost:3201/api/ai/chat \
            -H 'Content-Type: application/json' \
            -d '{"message":"你好"}' | head -c 100
          echo ""
          echo "── 安全响应头"
          curl -sI http://localhost:3201/ | grep -qi 'x-content-type-options'
          echo "── i18n 英文路由"
          curl -sf -o /dev/null -w "%{http_code}\n" http://localhost:3201/en
          echo "全部冒烟通过"
          kill $SERVER_PID
