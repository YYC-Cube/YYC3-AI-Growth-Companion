<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YYC³ 测试覆盖率监控仪表板</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .header h1 {
            color: #667eea;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card .label {
            color: #888;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 36px;
            font-weight: bold;
            color: #333;
        }

        .stat-card .trend {
            font-size: 14px;
            margin-top: 8px;
        }

        .trend.up {
            color: #10b981;
        }

        .trend.down {
            color: #ef4444;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .chart-card h3 {
            color: #333;
            font-size: 18px;
            margin-bottom: 20px;
        }

        .file-coverage {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
        }

        .file-coverage h3 {
            color: #333;
            font-size: 18px;
            margin-bottom: 20px;
        }

        .file-table {
            width: 100%;
            border-collapse: collapse;
        }

        .file-table th {
            background: #f8f9fa;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #555;
            border-bottom: 2px solid #e9ecef;
        }

        .file-table td {
            padding: 12px;
            border-bottom: 1px solid #e9ecef;
        }

        .file-table tr:hover {
            background: #f8f9fa;
        }

        .progress-bar {
            width: 100px;
            height: 20px;
            background: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .progress-fill.excellent {
            background: linear-gradient(90deg, #10b981, #059669);
        }

        .progress-fill.good {
            background: linear-gradient(90deg, #3b82f6, #2563eb);
        }

        .progress-fill.warning {
            background: linear-gradient(90deg, #f59e0b, #d97706);
        }

        .progress-fill.poor {
            background: linear-gradient(90deg, #ef4444, #dc2626);
        }

        .footer {
            text-align: center;
            color: white;
            padding: 20px;
            font-size: 14px;
        }

        .footer a {
            color: white;
            text-decoration: underline;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-badge.pass {
            background: #d1fae5;
            color: #065f46;
        }

        .status-badge.fail {
            background: #fee2e2;
            color: #991b1b;
        }

        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s ease;
        }

        .refresh-btn:hover {
            background: #5568d3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 YYC³ 测试覆盖率监控仪表板</h1>
            <p>实时监控项目测试覆盖率，确保代码质量</p>
            <div style="margin-top: 15px;">
                <button class="refresh-btn" onclick="location.reload()">🔄 刷新数据</button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="label">函数覆盖率</div>
                <div class="value">88.83%</div>
                <div class="trend up">↑ 48.83% 高于目标</div>
            </div>
            <div class="stat-card">
                <div class="label">行覆盖率</div>
                <div class="value">91.65%</div>
                <div class="trend up">↑ 41.65% 高于目标</div>
            </div>
            <div class="stat-card">
                <div class="label">测试通过率</div>
                <div class="value">100%</div>
                <div class="trend up">✅ 完美</div>
            </div>
            <div class="stat-card">
                <div class="label">测试数量</div>
                <div class="value">449</div>
                <div class="trend">31 个测试文件</div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <h3>📈 覆盖率趋势</h3>
                <canvas id="trendChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>📊 覆盖率分布</h3>
                <canvas id="distributionChart"></canvas>
            </div>
        </div>

        <div class="file-coverage">
            <h3>📁 文件覆盖率详情</h3>
            <table class="file-table">
                <thead>
                    <tr>
                        <th>文件</th>
                        <th>函数覆盖率</th>
                        <th>行覆盖率</th>
                        <th>状态</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>lib/character-manager.ts</td>
                        <td>82.93%</td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill excellent" style="width: 95.90%"></div>
                            </div>
                            95.90%
                        </td>
                        <td><span class="status-badge pass">✅ 通过</span></td>
                    </tr>
                    <tr>
                        <td>lib/utils.ts</td>
                        <td>94.74%</td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill good" style="width: 87.39%"></div>
                            </div>
                            87.39%
                        </td>
                        <td><span class="status-badge pass">✅ 通过</span></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="footer">
            <p>© 2026 YYC³ Development Team | <a href="https://github.com/YY-Nexus/yyc3-xyai">GitHub</a></p>
        </div>
    </div>

    <script>
        // 覆盖率趋势数据
        const trendData = {
            labels: ['1月', '2月', '3月', '4月', '5月', '6月'],
            datasets: [{
                label: '函数覆盖率',
                data: [75, 78, 82, 85, 87, 88.83],
                borderColor: '#667eea',
                backgroundColor: 'rgba(102, 126, 234, 0.1)',
                fill: true,
                tension: 0.4
            }, {
                label: '行覆盖率',
                data: [78, 82, 85, 88, 90, 91.65],
                borderColor: '#764ba2',
                backgroundColor: 'rgba(118, 75, 162, 0.1)',
                fill: true,
                tension: 0.4
            }]
        };

        // 覆盖率分布数据
        const distributionData = {
            labels: ['优秀 (>90%)', '良好 (80-90%)', '一般 (70-80%)', '需改进 (<70%)'],
            datasets: [{
                data: [65, 25, 8, 2],
                backgroundColor: [
                    '#10b981',
                    '#3b82f6',
                    '#f59e0b',
                    '#ef4444'
                ],
                borderWidth: 0
            }]
        };

        // 创建趋势图表
        const trendCtx = document.getElementById('trendChart').getContext('2d');
        new Chart(trendCtx, {
            type: 'line',
            data: trendData,
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'top',
                    }
                },
                scales: {
                    y: {
                        beginAtZero: false,
                        min: 70,
                        max: 100,
                        ticks: {
                            callback: function(value) {
                                return value + '%';
                            }
                        }
                    }
                }
            }
        }
        });

        // 创建分布图表
        const distributionCtx = document.getElementById('distributionChart').getContext('2d');
        new Chart(distributionCtx, {
            type: 'doughnut',
            data: distributionData,
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'right',
                    }
                }
            }
        });
    </script>
</body>
</html>
